<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>game</title>
  <style>
    body {
      background: #000000;
      color: white;
    }
    a {
      color: #f4325f;
      background: #2e0e80;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
  <script>
    function supportsWasmThreads() {
      if (typeof SharedArrayBuffer === 'undefined') {
        return false;
      }

      try {
        // minimal WASM binary using shared memory and atomic
        const bytes = new Uint8Array([0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x04, 0x01, 0x60, 0x00, 0x00, 0x02, 0x11, 0x01, 0x04, 0x65, 0x6e, 0x76, 0x06, 0x6d, 0x65, 0x6d, 0x6f, 0x72, 0x79, 0x02, 0x01, 0x01, 0x01, 0x0a, 0x09, 0x01, 0x07, 0x00, 0xfe, 0x10, 0x02, 0x00, 0x00, 0x0b]);
        return WebAssembly.validate(bytes);
      } catch (e) {
        return false;
      }
    }

    var fmodStudioPreloadScript = document.createElement('script');
    if (typeof WebAssembly === "object" && typeof SharedArrayBuffer === "function") {
      if (supportsWasmThreads()) {
        fmodStudioPreloadScript.src = "wasm/fmodstudioP.js";
      } else {
        fmodStudioPreloadScript.src = "wasm/fmodstudio.js";
      }
    } else {
      fmodStudioPreloadScript.src = "fmodstudio.js";
    }
    // block HTML parsing until FMOD is loaded to ensure the main script gets it
    document.write(fmodStudioPreloadScript.outerHTML);
  </script>
</head>
<body>
  <div id="content">
    <canvas id="canvas" width="100%" height="100%"></canvas>
  </div>
</body>
<script type="text/javascript" src="latency-test.js"></script>
</html>
